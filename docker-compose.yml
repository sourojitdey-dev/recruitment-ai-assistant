version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: recruitment_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      POSTGRES_DB: ${POSTGRES_DB:-recruitment_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-recruitment_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recruitment_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-recruitment_db}
      - SECRET_KEY=${SECRET_KEY:-your-secure-secret-key-32-chars-long}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - ACCESS_TOKEN_EXPIRE_MINUTES=60
    volumes:
      - ./storage:/app/storage

volumes:
  postgres_data:
